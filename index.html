<script>
    function showTab(tabId) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.content');

      tabs.forEach(tab => tab.classList.remove('active'));
      contents.forEach(content => content.classList.remove('active'));

      document.querySelector(`.tab[onclick="showTab('${tabId}')"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
</script>

<script>
  async function triggerDonation() {
   const amount = document.getElementById("amount").value;
    const status = document.getElementById("donate-status");
    status.textContent = "Processing...";

    // 1) Lag Payment Intent på serveren
    const res = await fetch("https://didgetsphere.onrender.com/create-payment-intent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: amount * 100 }) // USD → cents
    });

    const data = await res.json();

    // 2) Fullfør betaling med Stripe Elements
  const result = await stripe.confirmCardPayment(data.clientSecret, {
  payment_method: {
    card: card
  }
});

if (result.error) {
  status.textContent = "Error: " + result.error.message;
  return;
}

const intent = result.paymentIntent;

// 1) SCA / 3D Secure
if (intent.status === "requires_action") {
  const actionResult = await stripe.confirmCardPayment(data.clientSecret, {
    payment_method: {
      card: card
    }
  });

  if (actionResult.error) {
    status.textContent = "Error: " + actionResult.error.message;
    return;
  }

  if (actionResult.paymentIntent.status === "succeeded") {
    status.textContent = "Thank you for your donation!";
    return;
  }
}

// 2) Stripe trenger et ekstra confirm-kall
if (intent.status === "requires_confirmation") {
  const confirmAgain = await stripe.confirmCardPayment(data.clientSecret, {
    payment_method: {
      card: card
    }
  });

  if (confirmAgain.error) {
    status.textContent = "Error: " + confirmAgain.error.message;
    return;
  }

  if (confirmAgain.paymentIntent.status === "succeeded") {
    status.textContent = "Thank you for your donation!";
    return;
  }
}

// 3) Ferdig
if (intent.status === "succeeded") {
  status.textContent = "Thank you for your donation!";
}
}
</script>

<script>
  const donateBtn = document.getElementById("donate-button");
  const modal = document.getElementById("donate-confirm-modal");
  const confirmBtn = document.getElementById("confirm-donate");
  const cancelBtn = document.getElementById("cancel-donate");

  donateBtn.addEventListener("click", function (e) {
    e.preventDefault();
    modal.style.display = "block";
  });

  cancelBtn.addEventListener("click", function () {
    modal.style.display = "none";
  });

  confirmBtn.addEventListener("click", function () {
    modal.style.display = "none";
    triggerDonation();   // runs your Stripe logic
  });
</script>
