 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Did Get Sphere</title>
  <style>
    body {
      margin: 0;
      background-color: #000000;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #EEEEEE;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 0;
      text-align: center;
      backdrop-filter: blur(2px);
    }
    .tab-container {
      display: flex;
      background-color: #000000;
    }
    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      color: white;
      cursor: pointer;
      border-bottom: 15px solid transparent;
      transition: background-color 0.3s, border-bottom 0.3s;
    }
    .tab:hover {
      background-color: #000000;
    }
    .tab.active {
      border-bottom: 15px solid #909090;
      background-color: #000000;
    }
    .content {
      padding: 15px;
      display: none;
    }
    .content.active {
      display: block;
      padding: 0;
    }
    .logoContainer {
      position: relative;
    }
    .logo {
       position: relative;
       left: 49.2%;
       transform: translateX(-50%);
       max-width: 100vw;   /* scales to 100% of the viewport width */
       height: auto;      /* keeps proportions */
       display: block;
    }

    .spacer {
      margin-bottom: 20px;
    }
    .spacer2 {
      margin-bottom: 30px;
    }
   .spacer3 {
      margin-bottom: 60px;
    }
  </style>
</head>
<body>

  <div class="tab-container">
    <div class="tab" onclick="showTab('google')">Google Play</div>
    <div class="tab" onclick="showTab('contact')">Contact</div>
  </div>
 <div class="spacer"></div>
  <div class="logoContainer">
    <img src="logo_website.png" class="logo">
  </div>
  <div id="home" class="content active">

    <div class="spacer3"></div>
</div>

</div>

   target="_blank" 
   style="color: lightgray;">
   Random Number Generator
</a></p>
</div>
<div id="contact" class="content">
<div class="spacer"></div>
   <a href="mailto:developer@didgetsphere.com" style="color: lightgray;">developer@didgetsphere.com</a></p>
<div class="spacer2"></div>
</div>
 
<script src="https://js.stripe.com/v3/"></script>

<script>
    function showTab(tabId) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.content');

      tabs.forEach(tab => tab.classList.remove('active'));
      contents.forEach(content => content.classList.remove('active'));

      document.querySelector(`.tab[onclick="showTab('${tabId}')"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
</script>

</script>

</body>
</html>
